plugins {
    id 'com.android.application'
}

android {
    namespace 'com.likhon.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.likhon.keyboard'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.6'
        resourceConfigurations += ['en', 'bn']
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
